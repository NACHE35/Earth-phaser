name: Build Earth Phaser (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configuration
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilation
        run: cmake --build build --config Release --parallel

      - name: Archive le plugin
        uses: actions/upload-artifact@v4
        with:
          name: EarthPhaser-Windows
          if-no-files-found: warn
          path: |
            build/EarthPhaser_artefacts/Release/VST3
            build/EarthPhaser_artefacts/Release/Standalone
